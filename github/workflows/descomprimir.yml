name: Descomprimir zip

on:
  push:
    branches: [main]
    paths: ["**.zip"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir en la raíz del repositorio
        run: |
          set -e
          ZIP=$(git ls-files '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then echo "No hay ningún .zip en el repositorio"; exit 1; fi
          echo "Descomprimiendo $ZIP"
          rm -rf /tmp/zip && mkdir -p /tmp/zip
          unzip -q "$ZIP" -d /tmp/zip
          # Si el zip trae una carpeta raíz (MusicFees/), se usa su contenido.
          SRC=/tmp/zip
          if [ "$(ls -A /tmp/zip | wc -l)" = "1" ] && [ -d "/tmp/zip/$(ls -A /tmp/zip)" ]; then SRC="/tmp/zip/$(ls -A /tmp/zip)"; fi
          # GitHub no deja que una Action modifique workflows: .github se omite.
          rsync -a --exclude '.git' --exclude '.github' --exclude 'node_modules' "$SRC"/ ./
          git rm -q --cached "$ZIP" && rm -f "$ZIP"
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Descomprimir proyecto desde el zip" || echo "Sin cambios"
          git push
