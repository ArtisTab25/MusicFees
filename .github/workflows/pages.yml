name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  # Los commits que hace "Descomprimir zip" no disparan push: se publica al terminar ese workflow.
  workflow_run:
    workflows: ["Descomprimir zip"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Demucs v4 de 6 fuentes (MIT) en ONNX para el modo Fiel: checkpoint oficial (huella comprobada en
      # el script) y exportación con el paquete oficial de PyPI.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exportar Demucs 6 fuentes
        run: |
          mkdir -p .cache/demucs
          curl -sSL -o .cache/demucs/5c90dfd2-34c22ccb.th https://github.com/nomadkaraoke/python-audio-separator/releases/download/model-configs/5c90dfd2-34c22ccb.th
          pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet demucs onnx einops
          python scripts/export-demucs.py .cache/demucs/5c90dfd2-34c22ccb.th .cache/demucs
      # Beat This! (CPJKU, MIT; conversión a ONNX de tuneperfect, MIT): pulso y compás. Huella comprobada.
      - name: Preparar Beat This!
        run: |
          mkdir -p .cache/beatthis
          curl -sSL -o .cache/beatthis/beat_this.onnx https://huggingface.co/tuneperfect/beat-this-onnx/resolve/main/beat_this.onnx
          echo "926847099887de0d577509824846c89797b02fb28e35fc004c3add149c465891  .cache/beatthis/beat_this.onnx" | sha256sum -c -
          python scripts/pack-beatthis.py .cache/beatthis/beat_this.onnx .cache/beatthis
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
